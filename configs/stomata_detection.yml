task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mmfs1/scratch/jacks.local/sgummi/IPA_COCO_25/train
    ann_file: /mmfs1/scratch/jacks.local/sgummi/IPA_COCO_25/train/_coco_rtdetrv4_zero.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [4, 15, 25]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  shuffle: True
  num_workers: 1
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 4
    stop_epoch: 25
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs: [4, 15]
  total_batch_size: 8

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mmfs1/scratch/jacks.local/sgummi/IPA_COCO_25/val
    ann_file: /mmfs1/scratch/jacks.local/sgummi/IPA_COCO_25/val/_coco_rtdetrv4_zero.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 1
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
