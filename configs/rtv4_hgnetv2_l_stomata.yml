__include__: [
  '../rtv4/rtv4_hgnetv2_l_coco.yml',
  './stomata_detection.yml'
]

output_dir: /mmfs2/scratch/jacks.local/sgummi/rtdetrv4_outputs/rtv4_hgnetv2_l_stomata

num_classes: 1
remap_mscoco_category: False

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: /home/jacks.local/sgummi/2026_2/rtdetr_v4/RT-DETRv4-main/dinov3
  dinov3_weights_path: /home/jacks.local/sgummi/2026_2/rtdetr_v4/RT-DETRv4-main/pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

HybridEncoder:
  distill_teacher_dim: 768

RTv4Criterion:
  weight_dict:
    loss_distill: 15.0
  distill_adaptive_params:
    enabled: True
    rho: 2
    delta: 0.1
    default_weight: 15

epoches: 30
flat_epoch: 15
no_aug_epoch: 5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

train_dataloader:
  total_batch_size: 16
  num_workers: 1
  dataset:
    transforms:
      policy:
        epoch: [4, 15, 25]
  collate_fn:
    mixup_epochs: [4, 15]
    stop_epoch: 25

val_dataloader:
  total_batch_size: 16
  num_workers: 1
